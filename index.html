<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F9FAFB">
  <title>Acólitos São Francisco</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1F2937;
      --muted: rgba(31,41,55,.68);
      --line: rgba(30,58,138,.14);
      --paper: #F9FAFB;
      --page: #F9FAFB;
      --primary: #1E3A8A;
      --primary-soft: rgba(30,58,138,.08);
      --accent: #D97706;
      --accent-soft: rgba(217,119,6,.12);
      --danger: #1F2937;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      line-height: 1.5;
    }

    button, input { font: inherit; }
    button {
      cursor: pointer;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    button:active {
      background-color: var(--primary) !important;
      border-color: var(--primary) !important;
      color: #fff !important;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }

    .shell { width: min(100% - 40px, 920px); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 27px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-logo { width: 44px; height: 56px; flex: 0 0 auto; object-fit: cover; border-radius: 50%; }
    .brand-name { margin: 0; color: var(--primary); font-size: 19px; font-weight: 650; letter-spacing: -.025em; }
    .brand-caption { margin: 1px 0 0; color: var(--muted); font-size: 12px; }

    .nav { display: flex; gap: 5px; }
    .nav button {
      display: grid;
      width: 48px;
      height: 48px;
      padding: 0;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
    }
    .nav button[data-page="home"] { width: auto; min-width: 48px; padding: 0 12px; border-radius: 8px; font-size: 13px; }
    .nav button[aria-current="page"] { color: var(--primary); background: var(--primary-soft); font-weight: 600; }

    main { padding: 32px 0 64px; }
    .page-heading { margin: 0 0 18px; color: var(--primary); font-size: 21px; font-weight: 620; letter-spacing: -.025em; }
    .intro { margin: -10px 0 25px; color: var(--muted); font-size: 14px; }

    .next-card {
      overflow: hidden;
      padding: 28px 30px;
      color: #fff;
      background: var(--primary);
      border-radius: 12px;
    }
    .eyebrow { margin: 0 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
    .next-date { margin: 0; font-size: clamp(21px, 4vw, 32px); font-weight: 620; letter-spacing: -.035em; }
    .next-card .confirmation-status { margin-left: 0; }
    .team-title { margin: 0 0 11px; font-size: 13px; font-weight: 600; }
    .next-team { padding-top: 16px; border-top: 1px solid rgba(249,250,251,.2); }
    .team-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; }
    .team-person {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      color: #fff;
      background: rgba(249,250,251,.12);
      border-radius: 7px;
      font-size: 13px;
    }
    .team-person-identity, .member-identity, .mass-detail-identity { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .team-person-identity { flex: 1 1 auto; font-weight: 600; }
    .team-person-identity > span:last-child { overflow-wrap: anywhere; }
    .profile-avatar { display: grid; flex: 0 0 36px; width: 36px; height: 36px; place-items: center; overflow: hidden; color: var(--primary); background: var(--primary-soft); border-radius: 50%; font-size: 12px; font-weight: 700; }
    .team-person .profile-avatar { background: var(--page); }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-avatar-small { flex-basis: 30px; width: 30px; height: 30px; font-size: 10px; }
    .team-role { flex: 0 0 auto; max-width: 42%; color: rgba(249,250,251,.82); text-align: right; }
    .unassigned { margin: 0; color: rgba(249,250,251,.88); font-size: 14px; }

    .schedule-section { margin-top: 37px; }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }
    .section-heading h2 { margin: 0; color: var(--primary); font-size: 17px; font-weight: 620; letter-spacing: -.015em; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .schedule-note { margin: -5px 0 14px; color: var(--muted); font-size: 12px; }
    .mass-list { display: grid; gap: 9px; }
    .mass-entry {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .mass-row {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 17px;
      color: inherit;
      background: transparent;
      border: 0;
      text-align: left;
      font: inherit;
    }
    .mass-row:hover { background: var(--primary-soft); }
    .mass-row:focus-visible { outline: 2px solid var(--primary); outline-offset: -3px; }
    .mass-date { margin: 0; color: var(--primary); font-size: 14px; font-weight: 600; }
    .mass-meta { display: block; margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .expand-indicator { flex: 0 0 9px; width: 9px; height: 9px; margin-right: 3px; border-right: 1.5px solid var(--accent); border-bottom: 1.5px solid var(--accent); transform: rotate(45deg) translateY(-2px); transition: transform .15s ease; }
    .mass-row[aria-expanded="true"] .expand-indicator { transform: rotate(225deg) translate(-2px, -1px); }
    .mass-detail { display: grid; gap: 7px; padding: 11px 17px 14px; border-top: 1px solid var(--line); }
    .mass-detail[hidden] { display: none; }
    .mass-detail-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
    .mass-detail-role { color: var(--muted); text-align: right; }
    .mass-detail-empty { margin: 0; color: var(--muted); font-size: 13px; }
    .note-alert { display: inline-grid; width: 18px; height: 18px; margin-left: 7px; place-items: center; color: var(--ink); background: var(--accent-soft); border-radius: 50%; font-size: 12px; font-weight: 800; vertical-align: middle; }
    .mass-note { display: flex; align-items: flex-start; gap: 9px; margin: 6px 0 0; padding: 10px 12px; color: var(--ink); background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 7px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mass-note .note-alert { margin-left: 0; }
    .mass-note p { margin: 0; }
    .next-card .mass-note { align-items: center; margin: 18px 0; color: #fff; background: rgba(249,250,251,.12); }
    .next-card .note-alert { flex: 0 0 18px; color: var(--ink); background: var(--accent); }
    .empty-note { margin: 0; padding: 19px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 9px; font-size: 14px; }

    .admin-grid { display: grid; gap: 16px; }
    .panel {
      padding: 21px 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .login-panel { width: min(100%, 430px); margin: 20px auto 0; }
    .login-form { display: grid; gap: 13px; margin-top: 18px; }
    .login-form .button { width: 100%; }
    .login-error { min-height: 20px; margin: 0; color: var(--danger); font-size: 13px; }
    .admin-heading-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .admin-heading-row .page-heading { margin: 0; }
    .admin-heading-row { margin-bottom: 8px; }
    .panel h2 { margin: 0; color: var(--primary); font-size: 16px; font-weight: 620; }
    .panel-description { margin: 5px 0 17px; color: var(--muted); font-size: 13px; }
    .form-row { display: flex; align-items: end; gap: 9px; }
    .member-add-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 0; color: var(--primary); background: transparent; border: 0; text-align: left; font-size: 16px; font-weight: 620; }
    .member-add-toggle[aria-expanded="true"] .expand-indicator { transform: rotate(225deg) translate(-2px, -1px); }
    .member-add-toggle:active { color: var(--primary) !important; background-color: transparent !important; border-color: transparent !important; box-shadow: none !important; }
    .member-form { display: grid; gap: 13px; margin-top: 15px; }
    .member-form[hidden] { display: none; }
    .member-form-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .photo-file-control { display: flex; min-height: 41px; align-items: center; gap: 9px; padding: 5px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; }
    .photo-file-control:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .photo-file-button { flex: 0 0 auto; }
    .photo-file-name { min-width: 0; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .photo-adjustment { display: grid; width: fit-content; gap: 8px; }
    .photo-adjustment[hidden] { display: none; }
    .photo-adjustment label { color: var(--ink); font-size: 12px; font-weight: 600; }
    .photo-crop-preview { width: 180px; height: 180px; touch-action: none; background: var(--primary-soft); border: 1px solid var(--line); border-radius: 8px; cursor: grab; }
    .photo-crop-preview:active { cursor: grabbing; }
    .photo-adjustment input { width: 180px; accent-color: var(--primary); }
    .photo-adjustment p { max-width: 260px; margin: 0; color: var(--muted); font-size: 12px; }
    .member-form-actions { display: flex; gap: 8px; }
    .field { display: grid; flex: 1; gap: 6px; min-width: 0; }
    .field label { color: var(--ink); font-size: 12px; font-weight: 600; }
    .field input {
      width: 100%;
      min-height: 41px;
      padding: 9px 11px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
    }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 13px;
      color: var(--primary);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .button:hover { background: var(--primary-soft); }
    .button-primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .button-primary:hover { background: var(--primary); }
    .button-danger { color: var(--danger); border-color: var(--line); }
    .button-small { min-height: 32px; padding: 5px 9px; font-size: 12px; }
    .member-list { display: grid; gap: 7px; margin: 15px 0 0; padding: 0; list-style: none; }
    .member-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
    .member-name { overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .member-actions { display: flex; gap: 6px; }
    .member-count { color: var(--muted); font-size: 12px; }
    .admin-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 15px; }
    .admin-events { display: grid; gap: 9px; margin-top: 17px; }
    .admin-event { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; }
    .admin-event-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; color: var(--ink); background: var(--paper); border: 0; text-align: left; font: inherit; }
    .admin-event-toggle:hover { background: var(--primary-soft); }
    .admin-event-summary { min-width: 0; }
    .admin-event-details { padding: 0 14px 14px; }
    .admin-event-details[hidden] { display: none; }
    .admin-event-name { margin: 0; color: var(--primary); font-size: 13px; font-weight: 600; }
    .admin-event-form { display: grid; grid-template-columns: repeat(2, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
    .admin-event-form input { min-height: 36px; font-size: 13px; }
    .field textarea { width: 100%; min-height: 82px; padding: 9px 11px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: 13px; resize: vertical; }
    .field textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
    .admin-event-note { grid-column: 1 / -1; width: min(100%, 560px); justify-self: center; }
    .admin-event-note label { text-align: center; }
    .admin-event-form > button[type="submit"] { grid-column: 1 / -1; justify-self: center; }
    .admin-event-assignments { display: grid; grid-column: 1 / -1; gap: 10px; margin-top: 13px; }
    .admin-assignment-row { display: grid; grid-template-columns: minmax(150px, .7fr) minmax(180px, 1fr); gap: 10px; }
    .admin-manual-assignments { display: grid; grid-column: 1 / -1; gap: 9px; }
    .admin-manual-assignment-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; align-items: end; gap: 9px; }
    .admin-manual-assignment-row .button { min-height: 36px; }
    .admin-assignment-row select { width: 100%; min-height: 36px; padding: 7px 9px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: 13px; }
    .notice { margin: 0 0 16px; padding: 11px 13px; color: var(--ink); background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 7px; font-size: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 600px) {
      .shell { width: min(100% - 28px, 920px); }
      .topbar { align-items: center; padding: 19px 0 13px; gap: 12px; }
      .nav { flex: 0 0 auto; }
      main { padding-top: 24px; }
      .next-card { padding: 24px 20px; }
      .mass-row { align-items: flex-start; padding: 13px; }
      .mass-detail { padding: 10px 13px 12px; }
      .form-row { align-items: stretch; flex-direction: column; }
      .form-row .button { width: 100%; }
      .member-form-fields { grid-template-columns: 1fr; }
      .member-form-actions { flex-direction: column; }
      .member-form-actions .button { width: 100%; }
      .panel { padding: 18px 16px; }
      .admin-heading-row { align-items: flex-start; }
      .admin-assignment-row { grid-template-columns: 1fr; gap: 8px; }
      .admin-manual-assignment-row { grid-template-columns: 1fr; }
      .admin-actions { align-items: stretch; flex-direction: column; }
      .admin-actions .button { width: 100%; }
      .admin-event-form { grid-template-columns: 1fr; }
      .admin-event-form > button[type="submit"] { width: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/sao-francisco-logo.png" alt="Imagem de São Francisco">
        <div>
          <p class="brand-name">Acólitos São Francisco</p>
          <p class="brand-caption">Comunidade São Francisco</p>
        </div>
      </div>
      <nav class="nav" aria-label="Navegação principal">
        <button type="button" data-page="admin" aria-label="Administrador" title="Administrador">ADM</button>
        <button type="button" data-page="home" aria-label="Início" title="Início" hidden>Início</button>
      </nav>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>

  <script>
    (() => {
      const LEGACY_STORAGE_KEY = "acolitos-sao-francisco-v1";
      const FIRST_MASS_ROLES = ["Microfone", "Naveta", "Turíbulo"];
      const SECOND_MASS_ROLES = ["Microfone", "Missal"];
      const LEGACY_EXTRA_ROLE = "Acólito extra";
      const PDF_FIRST_GENERATION_ROTATION = [
        { first: [0, 1, 2], second: [1, 2, 0] },
        { first: [2, 0, 1], second: [0, 1, 2] },
        { first: [1, 2, 0], second: [2, 0, 1] },
        { first: [0, 2, 1], second: [2, 1, 0] },
        { first: [2, 1, 0], second: [1, 0, 2] },
        { first: [1, 0, 2], second: [0, 2, 1] }
      ];
      const PDF_ROTATION_MEMBER_NAMES = ["amanda", "fabricio", "brenda"];
      const defaultSettings = { secondSaturdayTime: "18:00", fourthSaturdayTime: "17:00" };
      const app = document.querySelector("#app");
      const navButtons = [...document.querySelectorAll("[data-page]")];
      let currentPage = "home";
      let isAdminAuthenticated = false;
      let cloudInitialized = false;
      let photoCrop = null;
      let photoDrag = null;
      let state;

      const newId = () => window.crypto && crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;

      function addMonths(date, amount) {
        const result = new Date(date);
        result.setMonth(result.getMonth() + amount);
        return result;
      }

      function localDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function createUpcomingMasses(settings) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const oneYearFromToday = new Date(today.getFullYear() + 1, today.getMonth(), today.getDate());
        const events = [];
        for (let offset = 0; offset <= 12; offset += 1) {
          const month = new Date(today.getFullYear(), today.getMonth() + offset, 1);
          for (const [ordinal, time] of [[2, settings.secondSaturdayTime], [4, settings.fourthSaturdayTime]]) {
            const firstDay = new Date(month.getFullYear(), month.getMonth(), 1);
            const firstSaturday = 1 + ((6 - firstDay.getDay() + 7) % 7);
            const date = new Date(month.getFullYear(), month.getMonth(), firstSaturday + (ordinal - 1) * 7);
            if (date < today || date > oneYearFromToday) continue;
            events.push({
              id: newId(),
              date: localDateString(date),
              time,
              massType: ordinal === 2 ? "first" : "second",
              assignments: []
            });
          }
        }
        return events.sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
      }

      function normalizeState(parsed) {
        if (parsed && typeof parsed === "object") {
          const settings = { ...defaultSettings, ...(parsed.settings || {}) };
          const members = Array.isArray(parsed.members) ? parsed.members : [];
          const masses = Array.isArray(parsed.masses) ? parsed.masses.map(mass => {
            const massType = mass.massType || inferMassType(mass.date, mass.time, settings);
            const roles = rolesForMass({ ...mass, massType });
            const assignments = (Array.isArray(mass.assignments) ? mass.assignments : []).map(item => {
              const member = item && item.role === LEGACY_EXTRA_ROLE
                ? members.find(candidate => candidate.id === item.memberId)
                : null;
              return member && typeof member.name === "string"
                ? { manualName: member.name, role: item.role }
                : item;
            });
            const regularAssignments = assignments.filter(item => item && typeof item.memberId === "string" && roles.includes(item.role));
            const manualAssignments = assignments.filter(item =>
              item && !item.memberId && typeof item.manualName === "string" && item.manualName.trim()
                && typeof item.role === "string" && item.role.trim()
            );
            const validAssignments = assignments.length === 0 || (
              assignments.length === roles.length + manualAssignments.length
              && regularAssignments.length === roles.length
              && roles.every(role => regularAssignments.some(item => item.role === role))
              && new Set(regularAssignments.map(item => item.memberId)).size === regularAssignments.length
            );
            const massData = { ...mass };
            delete massData.confirmed;
            return {
              ...massData,
              massType,
              note: typeof mass.note === "string" ? mass.note : "",
              assignments: validAssignments ? assignments : []
            };
          }) : [];
          return {
            members,
            settings,
            masses,
            initialOrderApplied: parsed.initialOrderApplied === true
          };
        }
        const initial = { members: [], settings: { ...defaultSettings }, masses: [], initialOrderApplied: false };
        initial.masses = createUpcomingMasses(initial.settings);
        return initial;
      }

      function inferMassType(dateString, time, settings) {
        const [year, month, day] = dateString.split("-").map(Number);
        const date = new Date(year, month - 1, day);
        const saturdayOrdinal = Math.floor((day - 1) / 7) + 1;
        if (date.getDay() === 6 && saturdayOrdinal === 2) return "first";
        if (date.getDay() === 6 && saturdayOrdinal === 4) return "second";
        return time === settings.secondSaturdayTime ? "first" : "second";
      }

      function rolesForMass(mass) {
        return mass.massType === "first" ? FIRST_MASS_ROLES : SECOND_MASS_ROLES;
      }

      function manualAssignmentRowMarkup(massId, index, assignment = {}) {
        const nameId = `manual-name-${massId}-${index}`;
        const roleId = `manual-role-${massId}-${index}`;
        return `<div class="admin-manual-assignment-row" data-manual-assignment-row>
          <div class="field"><label for="${escapeHtml(nameId)}">Nome do acólito</label><input id="${escapeHtml(nameId)}" name="manualName" type="text" maxlength="70" value="${escapeHtml(assignment.manualName || "")}" placeholder="Digite o nome"></div>
          <div class="field"><label for="${escapeHtml(roleId)}">Função</label><input id="${escapeHtml(roleId)}" name="manualRole" type="text" maxlength="70" value="${escapeHtml(assignment.role || "")}" placeholder="Digite a função"></div>
          <button class="button button-small button-danger" type="button" data-remove-manual-assignment>Remover</button>
        </div>`;
      }

      function generatePdfFirstAssignments(masses, members) {
        if (members.length !== PDF_ROTATION_MEMBER_NAMES.length) return null;
        const rotationMembers = PDF_ROTATION_MEMBER_NAMES.map(name => members.find(member =>
          member.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLocaleLowerCase("pt-BR") === name
        ));
        if (rotationMembers.some(member => !member)) return null;

        return masses.map(mass => {
          const [year, month] = mass.date.split("-").map(Number);
          const monthOffset = ((year - 2026) * 12 + month - 6) % PDF_FIRST_GENERATION_ROTATION.length;
          const rotation = PDF_FIRST_GENERATION_ROTATION[
            (monthOffset + PDF_FIRST_GENERATION_ROTATION.length) % PDF_FIRST_GENERATION_ROTATION.length
          ];
          const order = rotation[mass.massType];
          const roles = mass.massType === "first"
            ? ["Turíbulo", "Naveta", "Microfone"]
            : ["Missal", "Microfone"];
          return roles.map((role, index) => ({
            memberId: rotationMembers[order[index]].id,
            role
          }));
        });
      }

      async function apiRequest(path, options = {}) {
        const headers = { ...(options.headers || {}) };
        if (options.body) headers["Content-Type"] = "application/json";
        const response = await fetch(path, {
          ...options,
          headers,
          cache: "no-store",
          credentials: "same-origin"
        });
        const payload = await response.json();
        if (!response.ok) {
          const error = new Error(payload.error || "A solicitação não pôde ser concluída.");
          error.status = response.status;
          throw error;
        }
        return payload;
      }

      async function saveState() {
        try {
          await apiRequest("/api/state", { method: "PUT", body: JSON.stringify(state) });
          cloudInitialized = true;
          return true;
        } catch (error) {
          console.error("Não foi possível salvar os dados na nuvem.", error);
          if (error.status === 401) {
            isAdminAuthenticated = false;
            if (currentPage === "admin") render();
          }
          window.alert(error.status === 401
            ? "Sua sessão de administrador expirou. Entre novamente para salvar as alterações."
            : "Não foi possível salvar os dados na nuvem. Verifique a conexão e tente novamente.");
          return false;
        }
      }

      async function migrateLegacyState() {
        if (cloudInitialized) return;
        const currentState = state;
        let stored;
        try {
          stored = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (!stored) return;
          const parsed = JSON.parse(stored);
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
            throw new Error("Os dados locais antigos têm um formato inválido.");
          }
          state = normalizeState(parsed);
        } catch (error) {
          state = currentState;
          console.error("Não foi possível ler os dados locais antigos.", error);
          window.alert("Os dados locais antigos não puderam ser migrados. Eles continuam salvos neste navegador.");
          return;
        }

        if (await saveState()) {
          try {
            localStorage.removeItem(LEGACY_STORAGE_KEY);
            window.alert("Os dados salvos anteriormente neste navegador foram migrados para a nuvem.");
          } catch (error) {
            console.error("Os dados foram migrados, mas a cópia local antiga não pôde ser removida.", error);
            window.alert("Os dados foram migrados para a nuvem, mas a cópia antiga continua neste navegador.");
          }
        } else {
          state = currentState;
        }
      }

      async function initialize() {
        app.innerHTML = `<p class="empty-note">Carregando dados...</p>`;
        navButtons.forEach(button => { button.disabled = true; });
        let loaded = false;
        try {
          const [cloudData, session] = await Promise.all([
            apiRequest("/api/state"),
            apiRequest("/api/session")
          ]);
          if (!cloudData || !cloudData.state || typeof cloudData.initialized !== "boolean"
            || !session || typeof session.authenticated !== "boolean") {
            throw new Error("A API retornou um formato de dados inválido.");
          }
          state = normalizeState(cloudData.state);
          cloudInitialized = cloudData.initialized;
          isAdminAuthenticated = session.authenticated;
          render();
          loaded = true;
        } catch (error) {
          console.error("Não foi possível carregar os dados da nuvem.", error);
          app.innerHTML = `<section class="panel" role="alert">
            <h1 class="page-heading">Não foi possível carregar os dados</h1>
            <p>Verifique a configuração do banco e a conexão com a internet; depois, atualize a página.</p>

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      function formatDate(dateString, options = {}) {
        const [year, month, day] = dateString.split("-").map(Number);
        return new Intl.DateTimeFormat("pt-BR", options).format(new Date(year, month - 1, day));

        if (!file.type.startsWith("image/")) throw new Error("Selecione um arquivo de imagem.");
        if (file.size > 5 * 1024 * 1024) throw new Error("A foto deve ter no máximo 5 MB.");

      function drawPhotoCrop() {
        const canvas = document.querySelector("#photo-crop-preview");
        if (!canvas || !photoCrop) return;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Não foi possível ajustar a foto neste navegador.");
        const baseScale = Math.max(canvas.width / photoCrop.image.width, canvas.height / photoCrop.image.height);
        const width = photoCrop.image.width * baseScale * photoCrop.zoom;
        const height = photoCrop.image.height * baseScale * photoCrop.zoom;
        const maxX = Math.max(0, (width - canvas.width) / 2);
        const maxY = Math.max(0, (height - canvas.height) / 2);
        photoCrop.offsetX = Math.max(-maxX, Math.min(maxX, photoCrop.offsetX));
        photoCrop.offsetY = Math.max(-maxY, Math.min(maxY, photoCrop.offsetY));
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(photoCrop.image, (canvas.width - width) / 2 + photoCrop.offsetX,
          (canvas.height - height) / 2 + photoCrop.offsetY, width, height);
      }

      function croppedProfilePhoto() {
        if (!photoCrop) return "";
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Não foi possível ajustar a foto neste navegador.");
        const baseScale = Math.max(size / photoCrop.image.width, size / photoCrop.image.height);
        const width = photoCrop.image.width * baseScale * photoCrop.zoom;
        const height = photoCrop.image.height * baseScale * photoCrop.zoom;
        const ratio = size / 240;
        context.drawImage(photoCrop.image, (size - width) / 2 + photoCrop.offsetX * ratio,
          (size - height) / 2 + photoCrop.offsetY * ratio, width, height);
        const photo = canvas.toDataURL("image/jpeg", 0.78);
        if (photo.length > 150000) throw new Error("Não foi possível reduzir a foto o suficiente. Escolha outra imagem.");
        return photo;
      }

      function shuffle(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
        }
        return result;
      }

      function scheduleScore(assignments, masses, members) {
        const teams = new Set();
        const teamCounts = new Map();
        const pairCounts = new Map();
        const serviceCounts = new Map(members.map(member => [member.id, 0]));
        const roleCounts = new Map();
        let consecutiveRepeat = 0;

        masses.forEach((mass, index) => {
          const lineup = assignments[index];
          const ids = lineup.map(item => item.memberId).sort();
          const teamKey = ids.join("|");
          teams.add(teamKey);
          teamCounts.set(teamKey, (teamCounts.get(teamKey) || 0) + 1);
          lineup.forEach(item => {
            serviceCounts.set(item.memberId, (serviceCounts.get(item.memberId) || 0) + 1);
            const key = `${item.memberId}|${item.role}`;
            roleCounts.set(key, (roleCounts.get(key) || 0) + 1);
          });
          for (let left = 0; left < ids.length; left += 1) {
            for (let right = left + 1; right < ids.length; right += 1) {
              const pair = `${ids[left]}|${ids[right]}`;
              pairCounts.set(pair, (pairCounts.get(pair) || 0) + 1);
            }
          }
          if (index > 0) {
            const previous = new Set(assignments[index - 1].map(item => item.memberId));
            consecutiveRepeat += lineup.filter(item => previous.has(item.memberId)).length;
          }
        });

        const countValues = [...serviceCounts.values()];
        const average = countValues.reduce((total, count) => total + count, 0) / Math.max(1, countValues.length);
        const serviceImbalance = countValues.reduce((total, count) => total + (count - average) ** 2, 0);
        let roleImbalance = 0;
        const roles = [...new Set(masses.flatMap(rolesForMass))];
        roles.forEach(role => {
          const counts = members.map(member => roleCounts.get(`${member.id}|${role}`) || 0);
          const roleAverage = counts.reduce((total, count) => total + count, 0) / Math.max(1, counts.length);
          roleImbalance += counts.reduce((total, count) => total + (count - roleAverage) ** 2, 0);
        });
        const repeatedTeams = [...teamCounts.values()].reduce((total, count) => total + Math.max(0, count - 1), 0);
        const repeatedPairs = [...pairCounts.values()].reduce((total, count) => total + (count * (count - 1)) / 2, 0);
        return teams.size * 100000 - repeatedTeams * 2500 - repeatedPairs * 55 - consecutiveRepeat * 90 - serviceImbalance * 20 - roleImbalance * 8;
      }

      function generateAssignments(masses, members) {
        let bestAssignments = null;
        let bestScore = -Infinity;
        const attempts = 90;
        const candidatesPerMass = Math.min(60, Math.max(24, members.length * 3));
        for (let attempt = 0; attempt < attempts; attempt += 1) {
          const candidateAssignments = masses.map(() => []);
          const serviceCounts = new Map(members.map(member => [member.id, 0]));
          const roleCounts = new Map();
          const teamCounts = new Map();
          const pairCounts = new Map();
          let previousIds = new Set();

          masses.forEach((mass, massIndex) => {
            let selected = null;
            let selectedScore = Infinity;
            for (let candidate = 0; candidate < candidatesPerMass; candidate += 1) {
              const roles = rolesForMass(mass);
              const lineup = shuffle(members).slice(0, roles.length).map((member, index) => ({
                memberId: member.id,
                role: roles[index]
              }));
              const ids = lineup.map(item => item.memberId).sort();
              const teamKey = ids.join("|");
              let cost = (teamCounts.get(teamKey) || 0) * 1200;
              lineup.forEach(item => {
                cost += (serviceCounts.get(item.memberId) || 0) * 9;
                cost += (roleCounts.get(`${item.memberId}|${item.role}`) || 0) * 7;
                if (previousIds.has(item.memberId)) cost += 45;
              });
              for (let left = 0; left < ids.length; left += 1) {
                for (let right = left + 1; right < ids.length; right += 1) {
                  cost += (pairCounts.get(`${ids[left]}|${ids[right]}`) || 0) * 12;
                }
              }
              cost += Math.random() * 4;
              if (cost < selectedScore) {
                selected = lineup;
                selectedScore = cost;
              }
            }

            candidateAssignments[massIndex] = selected;
            const ids = selected.map(item => item.memberId).sort();
            const teamKey = ids.join("|");
            teamCounts.set(teamKey, (teamCounts.get(teamKey) || 0) + 1);
            selected.forEach(item => {
              serviceCounts.set(item.memberId, serviceCounts.get(item.memberId) + 1);
              const roleKey = `${item.memberId}|${item.role}`;
              roleCounts.set(roleKey, (roleCounts.get(roleKey) || 0) + 1);
            });
            for (let left = 0; left < ids.length; left += 1) {
              for (let right = left + 1; right < ids.length; right += 1) {
                const pair = `${ids[left]}|${ids[right]}`;
                pairCounts.set(pair, (pairCounts.get(pair) || 0) + 1);
              }
            }
            previousIds = new Set(ids);
          });

          const score = scheduleScore(candidateAssignments, masses, members);
          if (score > bestScore) {
            bestScore = score;
            bestAssignments = candidateAssignments;
          }
        }
        return bestAssignments;
      }

      function closeMemberForm() {
        const form = document.querySelector("#member-form");
        const toggle = document.querySelector("#toggle-member-form");
        if (form) {
          form.reset();
          form.hidden = true;
        }
        const adjustment = document.querySelector("#photo-adjustment");
        if (adjustment) adjustment.hidden = true;
        const fileName = document.querySelector("#photo-file-name");
        if (fileName) fileName.textContent = "Nenhuma foto selecionada";
        if (toggle) toggle.setAttribute("aria-expanded", "false");
        if (photoCrop) photoCrop.image.close();
        photoCrop = null;
        photoDrag = null;
      }

      async function selectProfilePhoto(file) {
        if (photoCrop) photoCrop.image.close();
        photoCrop = null;
        const adjustment = document.querySelector("#photo-adjustment");
        if (!file) {
          adjustment.hidden = true;
          return;
        }
        try {
          const image = await loadProfilePhoto(file);
          photoCrop = { image, zoom: 1, offsetX: 0, offsetY: 0 };
          document.querySelector("#photo-zoom").value = "1";
          adjustment.hidden = false;
          drawPhotoCrop();
        } catch (error) {
          document.querySelector("#member-photo").value = "";
          adjustment.hidden = true;
          document.querySelector("#photo-file-name").textContent = "Nenhuma foto selecionada";
          window.alert(error.message || "Não foi possível carregar a foto selecionada.");
        }
      }

      navButtons.forEach(button => button.addEventListener("click", () => {
        currentPage = button.dataset.page;
        render();
        app.focus();
      }));

      app.addEventListener("change", event => {
        if (event.target.matches("#member-photo") && currentPage === "admin" && isAdminAuthenticated) {
          const file = event.target.files[0];
          document.querySelector("#photo-file-name").textContent = file ? file.name : "Nenhuma foto selecionada";
          selectProfilePhoto(file);
        }
      });

      app.addEventListener("input", event => {
        if (event.target.matches("#photo-zoom") && photoCrop) {
          photoCrop.zoom = Number(event.target.value);
          drawPhotoCrop();
        }
      });

      app.addEventListener("pointerdown", event => {
        if (!event.target.matches("#photo-crop-preview") || !photoCrop) return;
        photoDrag = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
        event.target.setPointerCapture(event.pointerId);
      });

      app.addEventListener("pointermove", event => {
        if (!photoDrag || event.pointerId !== photoDrag.pointerId || !photoCrop) return;
        const canvas = event.target.closest("#photo-crop-preview");
        if (!canvas) return;
        const bounds = canvas.getBoundingClientRect();
        photoCrop.offsetX += (event.clientX - photoDrag.x) * (canvas.width / bounds.width);
        photoCrop.offsetY += (event.clientY - photoDrag.y) * (canvas.height / bounds.height);
        photoDrag.x = event.clientX;
        photoDrag.y = event.clientY;
        drawPhotoCrop();
      });

      app.addEventListener("pointerup", event => {
        if (photoDrag && event.pointerId === photoDrag.pointerId) photoDrag = null;
      });

      app.addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.target;
        if (form.id === "login-form") {
          const email = String(new FormData(form).get("email")).trim();
          const password = String(new FormData(form).get("password"));
          try {
            await apiRequest("/api/login", {
              method: "POST",
              body: JSON.stringify({ email, password })
            });
            isAdminAuthenticated = true;
            await migrateLegacyState();
            render();
          } catch (error) {
            console.error("Não foi possível autenticar o administrador.", error);
            form.querySelector("#login-error").textContent = error.status === 401
              ? "Usuário ou senha incorretos."
              : "Não foi possível acessar a área administrativa. Tente novamente.";
            form.elements.password.value = "";
            form.elements.password.focus();
          }
          return;
        }
        if (!isAdminAuthenticated || currentPage !== "admin") return;
        if (form.id === "member-form") {
          const input = form.elements.name;
          const name = input.value.trim();
          if (!name) return;
          if (state.members.some(member => member.name.toLocaleLowerCase("pt-BR") === name.toLocaleLowerCase("pt-BR"))) {
            window.alert("Esse acólito já está cadastrado.");
            return;
          }
          let photo;
          try {
            photo = croppedProfilePhoto();
          } catch (error) {
            window.alert(error.message || "Não foi possível ajustar a foto selecionada.");
            return;
          }
          const previousState = JSON.parse(JSON.stringify(state));
          state.members.push({ id: newId(), name, ...(photo ? { photo } : {}) });
          if (!await saveState()) { state = previousState; return; }
          closeMemberForm();
          render();
        } else if (form.matches("[data-event-form]")) {
          const mass = state.masses.find(item => item.id === form.dataset.eventForm);
          if (!mass) return;
          const date = form.elements.date.value;
          const time = form.elements.time.value;
          if (!date || !time) return;
          const roles = rolesForMass(mass);
          const chosenMembers = roles.map((_, index) => form.elements[`member-${index}`].value);
          const assignedCount = chosenMembers.filter(Boolean).length;
          const manualRows = [...form.querySelectorAll("[data-manual-assignment-row]")];
          const manualAssignments = manualRows.map(row => ({
            manualName: row.querySelector("[name='manualName']").value.trim(),
            role: row.querySelector("[name='manualRole']").value.trim()
          }));
          if (manualAssignments.some(item => Boolean(item.manualName) !== Boolean(item.role))) {
            window.alert("Preencha o nome e a função de cada acólito adicionado manualmente.");
            return;
          }
          const completedManualAssignments = manualAssignments.filter(item => item.manualName && item.role);
          let assignments = [];
          if (assignedCount > 0) {
            if (assignedCount !== roles.length) {
              window.alert(`Selecione um acólito para cada uma das ${roles.length} funções, ou deixe todas sem atribuição.`);
              return;
            }
            const chosenRoles = roles.map((_, index) => form.elements[`role-${index}`].value);
            if (chosenRoles.some(role => !roles.includes(role)) || new Set(chosenRoles).size !== roles.length) {
              window.alert("Cada função da missa deve ser escolhida uma única vez.");
              return;
            }
            if (new Set(chosenMembers).size !== roles.length) {
              window.alert("Cada acólito pode ocupar apenas uma função nesta missa.");
              return;
            }
            assignments = chosenMembers.map((memberId, index) => ({
              memberId,
              role: chosenRoles[index]
            }));
          }
          if (completedManualAssignments.length && assignedCount !== roles.length) {
            window.alert("Preencha a escala principal antes de adicionar acólitos extras.");
            return;
          }
          const normalizeName = name => name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLocaleLowerCase("pt-BR");
          const assignedNames = new Set(chosenMembers.filter(Boolean)
            .map(memberId => getMember(memberId).name)
            .map(normalizeName));
          for (const assignment of completedManualAssignments) {
            const nameKey = normalizeName(assignment.manualName);
            if (assignedNames.has(nameKey)) {
              window.alert("Cada acólito pode ocupar apenas uma função nesta missa.");
              return;
            }
            assignedNames.add(nameKey);
            assignments.push(assignment);
          }
          const previousState = JSON.parse(JSON.stringify(state));
          mass.date = date;
          mass.time = time;
          mass.note = String(form.elements.note.value).trim().slice(0, 500);
          mass.assignments = assignments;
          state.masses.sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
          if (!await saveState()) { state = previousState; return; }
          render();
        }
      });

      app.addEventListener("click", async event => {
        if (event.target.closest("[data-select-photo]")) {
          document.querySelector("#member-photo").click();
          return;
        }
        const memberFormToggle = event.target.closest("#toggle-member-form");
        if (memberFormToggle && currentPage === "admin" && isAdminAuthenticated) {
          const form = document.querySelector("#member-form");
          const opening = form.hidden;
          form.hidden = !opening;
          memberFormToggle.setAttribute("aria-expanded", String(opening));
          if (opening) form.elements.name.focus();
          else closeMemberForm();
          return;
        }
        const massToggle = event.target.closest("[data-toggle-mass]");
        if (massToggle && currentPage === "home") {
          const expanded = massToggle.getAttribute("aria-expanded") === "true";
          massToggle.setAttribute("aria-expanded", String(!expanded));
          const detail = document.getElementById(massToggle.getAttribute("aria-controls"));
          if (detail) detail.hidden = expanded;
          return;
        }
        const adminMassToggle = event.target.closest("[data-toggle-admin-mass]");
        if (adminMassToggle && currentPage === "admin" && isAdminAuthenticated) {
          const opening = adminMassToggle.getAttribute("aria-expanded") !== "true";
          app.querySelectorAll("[data-toggle-admin-mass][aria-expanded='true']").forEach(toggle => {
            if (toggle === adminMassToggle) return;
            toggle.setAttribute("aria-expanded", "false");
            const detail = document.getElementById(toggle.getAttribute("aria-controls"));
            if (detail) detail.hidden = true;
          });
          adminMassToggle.setAttribute("aria-expanded", String(opening));
          const details = document.getElementById(adminMassToggle.getAttribute("aria-controls"));
          if (details) details.hidden = !opening;
          return;
        }
        if (!isAdminAuthenticated || currentPage !== "admin") return;
        const addManualAssignment = event.target.closest("[data-add-manual-assignment]");
        if (addManualAssignment) {
          const form = addManualAssignment.closest("[data-event-form]");
          const list = form.querySelector("[data-manual-assignment-list]");
          const index = Number(list.dataset.nextIndex) || 0;
          list.dataset.nextIndex = String(index + 1);
          list.insertAdjacentHTML("beforeend", manualAssignmentRowMarkup(form.dataset.eventForm, index));
          list.lastElementChild.querySelector("[name='manualName']").focus();
          return;
        }
        const removeManualAssignment = event.target.closest("[data-remove-manual-assignment]");
        if (removeManualAssignment) {
          removeManualAssignment.closest("[data-manual-assignment-row]").remove();
          return;
        }
        const editButton = event.target.closest("[data-edit-member]");
        if (editButton) {
          const member = getMember(editButton.dataset.editMember);
          if (!member) return;
          const newName = window.prompt("Editar nome do acólito:", member.name);
          if (newName === null) return;
          const trimmed = newName.trim();
          if (!trimmed) {
            window.alert("O nome não pode ficar vazio.");
            return;
          }
          if (state.members.some(item => item.id !== member.id && item.name.toLocaleLowerCase("pt-BR") === trimmed.toLocaleLowerCase("pt-BR"))) {
            window.alert("Já existe um acólito com esse nome.");
            return;
          }
          const previousState = JSON.parse(JSON.stringify(state));
          member.name = trimmed;
          if (!await saveState()) { state = previousState; return; }
          render();
          return;
        }

        const deleteButton = event.target.closest("[data-delete-member]");
        if (deleteButton) {
          const member = getMember(deleteButton.dataset.deleteMember);
          if (!member || !window.confirm(`Excluir ${member.name} da lista de acólitos?`)) return;
          const previousState = JSON.parse(JSON.stringify(state));
          state.members = state.members.filter(item => item.id !== member.id);
          state.masses.forEach(mass => {
            mass.assignments = (mass.assignments || []).filter(item => item.memberId !== member.id);
          });
          if (!await saveState()) { state = previousState; return; }
          render();
          return;
        }

        if (event.target.closest("#generate-button")) {
          const activeMembers = [...state.members];
          if (activeMembers.length < FIRST_MASS_ROLES.length) {
            window.alert(`Cadastre pelo menos ${FIRST_MASS_ROLES.length} acólitos para preencher todas as funções da missa com mais vagas.`);
            return;
          }
          if (!window.confirm("Gerar uma nova escala para o próximo ano? As equipes atuais desse período serão substituídas.")) return;
          const masses = createUpcomingMasses(state.settings);
          const notesByDate = new Map(state.masses.filter(mass => mass.note).map(mass => [mass.date, mass.note]));
          const firstAssignments = state.initialOrderApplied
            ? null
            : generatePdfFirstAssignments(masses, activeMembers);
          const assignments = firstAssignments || generateAssignments(masses, activeMembers);
          const previousState = JSON.parse(JSON.stringify(state));
          state.masses = masses.map((mass, index) => ({
            ...mass,
            note: notesByDate.get(mass.date) || "",
            assignments: assignments[index]
          }));
          state.initialOrderApplied = true;
          if (!await saveState()) { state = previousState; return; }
          render();
        }
      });

      initialize();
    })();
  </script>
</body>
</html>
